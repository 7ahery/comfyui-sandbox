services:
  comfyui:
    build:
      context: .
      args:
        # Container user gets the same UID/GID as your WSL user (read from .env),
        # so files in ./data and the models folder have matching ownership.
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}

    # Name for the built image, so it isn't stored as an anonymous image.
    image: comfyui-local:latest

    # Fixed container name, used in commands like `docker exec comfyui ...`.
    container_name: comfyui

    # Never start on its own: booting the distro (or Docker) leaves ComfyUI
    # off. The Start shortcut runs `docker compose up -d` and stops the
    # container again when its window closes. A failed run stays stopped.
    restart: "no"

    # tini as PID 1: passes docker stop's SIGTERM on to ComfyUI and cleans up
    # orphaned child processes. Without it, Python as PID 1 ignores SIGTERM
    # and every stop waits 10 s before Docker kills it.
    init: true

    # Cap the log at 3 files of 10 MB. Docker's default keeps every run's
    # output forever, so a container started day after day would slowly fill
    # the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      # Publish ComfyUI's port on localhost only: reachable from Windows
      # at http://localhost:<COMFY_PORT>, but not from your network.
      # COMFY_PORT (in .env) is the Windows-side port; inside the container
      # ComfyUI always listens on 8188.
      - "127.0.0.1:${COMFY_PORT:-8188}:8188"

    volumes:
      # Persistent data: ComfyUI code, venv, custom nodes, outputs,
      # workflows and comfy-cli settings. Survives container rebuilds.
      - ./data:/workspace
      # Models folder (MODELS_DIR in .env): /mnt/models for a Windows folder
      # mounted via fstab, or a folder inside WSL. ComfyUI uses it through
      # --models-directory /models.
      - ${MODELS_DIR:-/mnt/models}:/models

    environment:
      # All choices live in .env; edit it, then `docker compose up -d`.
      # COMFY_ARGS: extra ComfyUI launch flags, e.g. --lowvram or --preview-method auto.
      - COMFY_ARGS=${COMFY_ARGS:-}
      # COMFY_INSTALL_ARGS: comfy-cli install flags, used only for the first
      # install (or after a recreate), e.g. --nvidia --version latest.
      - COMFY_INSTALL_ARGS=${COMFY_INSTALL_ARGS:-}

    # Larger shared memory for PyTorch (Docker's 64 MB default is too small).
    shm_size: "8gb"

    # Hardening: the container can't gain extra privileges (e.g. via sudo/setuid)
    # and has all Linux capabilities removed. ComfyUI doesn't need any.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

# GPU access is in docker-compose.gpu.yml, loaded through COMPOSE_FILE in .env.
